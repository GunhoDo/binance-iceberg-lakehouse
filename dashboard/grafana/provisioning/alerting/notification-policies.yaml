# 알림 라우팅 — 모든 알림을 Discord contact point로 보낸다.
# CRITICAL은 즉시(그룹 대기 짧게), 그 외는 기본 그룹핑.
apiVersion: 1

policies:
  - orgId: 1
    receiver: Discord Quality Alerts
    group_by: ['alertname', 'grafana_folder']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Discord Quality Alerts
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        repeat_interval: 1h
