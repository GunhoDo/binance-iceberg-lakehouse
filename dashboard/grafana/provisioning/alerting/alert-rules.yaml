# Grafana alert rules (PRD v2 P5 / FR-10·FR-11 "알림 연동").
#
# 지금까지 위험신호는 panel threshold로만 표시됐다(grafana_metrics.md Current Gaps).
# 여기서 실제 alert rule을 provisioning으로 정의해 Discord로 라우팅한다.
#
# 각 룰: Athena 쿼리(A) → reduce last(B) → threshold(C). condition=C.
# 검증됨: grafana 프로파일 기동 시 두 룰이 provisioning으로 정상 등록됨(API 확인).
# 주의: Grafana >= 10 unified alerting 전제. 잘못된 alerting provisioning은 격리되지 않고
# **Grafana 기동 자체를 실패시킨다**(contact-points.yaml 참조). 룰 수정 후엔 grafana를
# 재기동해 provisioning 에러가 없는지 로그로 확인하라.
apiVersion: 1

groups:
  - orgId: 1
    name: data-quality
    folder: Binance Lakehouse
    interval: 1m
    rules:
      - uid: critical-quality-anomaly
        title: CRITICAL data quality anomaly present
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "quality_events에 최근 24h CRITICAL 이상이 존재합니다."
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: athena_iceberg
            model:
              refId: A
              datasource:
                type: grafana-athena-datasource
                uid: athena_iceberg
              format: table
              rawSQL: "SELECT COUNT(*) AS value FROM quality_events WHERE severity = 'CRITICAL' AND detected_at >= (SELECT MAX(detected_at) - INTERVAL '1' DAY FROM quality_events)"
              connectionArgs:
                region: __default
                catalog: __default
                database: __default
                resultReuseEnabled: false
                resultReuseMaxAgeInMinutes: 60
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: pipeline
    folder: Binance Lakehouse
    interval: 1m
    rules:
      - uid: pipeline-task-failure
        title: Pipeline task failure in last 24h
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pipeline_run_summary에 최근 24h 실패 task가 있습니다."
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: athena_iceberg
            model:
              refId: A
              datasource:
                type: grafana-athena-datasource
                uid: athena_iceberg
              format: table
              rawSQL: "SELECT COUNT(*) AS value FROM pipeline_run_summary WHERE UPPER(status) IN ('FAILED', 'FAILURE', 'ERROR') AND created_at >= (SELECT MAX(created_at) - INTERVAL '1' DAY FROM pipeline_run_summary)"
              connectionArgs:
                region: __default
                catalog: __default
                database: __default
                resultReuseEnabled: false
                resultReuseMaxAgeInMinutes: 60
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
