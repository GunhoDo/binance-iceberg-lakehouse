apiVersion: 1

datasources:
  - name: Athena-Iceberg
    type: grafana-athena-datasource
    uid: athena_iceberg
    isDefault: true
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
      catalog: AwsDataCatalog
      database: binance_lakehouse
      workgroup: primary
      outputLocation: s3://binance-iceberg-lake/athena-results/grafana/