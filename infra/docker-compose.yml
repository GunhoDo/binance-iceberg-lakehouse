##############################################################
# Binance Iceberg Lakehouse - Infra
#
# Streaming only:
#   docker compose -f infra/docker-compose.yml --profile streaming up -d
#
# Airflow only:
#   docker compose -f infra/docker-compose.yml --profile airflow up -d --build
#   docker compose -f infra/docker-compose.yml --profile airflow down -v
# Streaming + Airflow:
#   docker compose -f infra/docker-compose.yml --profile streaming --profile airflow up -d --build
#   docker compose -f infra/docker-compose.yml --profile streaming --profile airflow down -v
##############################################################

services:
  # ---------------------------------------------------------------------------
  # Kafka - streaming profile
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    profiles: ["streaming"]
    networks:
      - lakehouse

  kafka-topic-init:
    image: apache/kafka:3.7.0
    container_name: kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        set -e

        echo "==> Creating Kafka topics"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic trades \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic klines \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic orders \
          --partitions 1 \
          --replication-factor 1

        echo "==> Kafka topics"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list
    profiles: ["streaming"]
    networks:
      - lakehouse

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["streaming"]
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Spark runner - airflow profile
  # ---------------------------------------------------------------------------
  spark-runner:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    container_name: spark-runner
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /workspace
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
    volumes:
      - ..:/workspace
    profiles: ["airflow"]
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Airflow - airflow profile
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["airflow"]
    networks:
      - lakehouse

  airflow-init:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: airflow-init
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      spark-runner:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "binance-lakehouse-local-secret"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "airflow"
      _AIRFLOW_WWW_USER_PASSWORD: "airflow"
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: version
    profiles: ["airflow"]
    networks:
      - lakehouse

  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: airflow-webserver
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      spark-runner:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "binance-lakehouse-local-secret"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles: ["airflow"]
    networks:
      - lakehouse

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      spark-runner:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "binance-lakehouse-local-secret"
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    profiles: ["airflow"]
    networks:
      - lakehouse

volumes:
  kafka_data:
    driver: local

  airflow_postgres_data:
    driver: local

  airflow_logs:
    driver: local

networks:
  lakehouse:
    driver: bridge
