# 30-spark-rbac.yaml — Spark-on-k8s 실행 권한 (Phase K2)
#
# spark-submit(client 모드) 드라이버가 executor 파드를 직접 생성/감시/삭제한다.
# 이를 위한 ServiceAccount + 네임스페이스 한정 Role(파드/서비스/컨피그맵 관리).
# 클러스터 전역 권한은 부여하지 않는다(네임스페이스 스코프 최소권한).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: binance-lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: binance-lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    # Spark 는 SparkContext.stop() 에서 executor 컨피그맵을 deletecollection 으로
    # 일괄 정리한다 — 이 verb 가 없으면 작업은 끝나도 정리 단계에서 Forbidden 로그.
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: binance-lakehouse
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: binance-lakehouse
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
