# 10-kafka.yaml — Kafka (KRaft) StatefulSet + Service + topic init (Phase K1)
#
# 격리 원칙(ROADMAP §4.2): 브로커 수명(PVC) vs 잡 수명(Pod) 분리.
# 단일 브로커 KRaft. 광고 리스너는 StatefulSet 파드 FQDN 으로 고정한다.
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: binance-lakehouse
  labels:
    app: kafka
spec:
  clusterIP: None          # headless — kafka-0.kafka.<ns>.svc 로 파드 직접 지정
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: binance-lakehouse
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.binance-lakehouse.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.binance-lakehouse.svc.cluster.local:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "binance-lakehouse-k3d-0001"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: binance-lakehouse
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.7.0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              BS=kafka-0.kafka.binance-lakehouse.svc.cluster.local:9092
              echo "==> waiting for kafka"
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $BS >/dev/null 2>&1; do sleep 3; done
              for t in trades klines orders; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS \
                  --create --if-not-exists --topic $t --partitions 1 --replication-factor 1
              done
              echo "==> topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS --list
